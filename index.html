<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kawaii Niespodzianka ✨</title>
    <link rel="stylesheet" href="style.css">
    <!-- Czcionka w stylu kawaii/anime -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Mali:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Kontener z płatkami/serduszkami tła -->
    <div id="particles"></div>

    <main class="card-container">
        <div class="kawaii-badge"> ( ˶ˆ ꒳ ˆ˵ ) </div>
        <h1 class="sparkle-title">Witaj, Cuty! ✨</h1>
        <p class="subtitle">Mam dla Ciebie coś wyjątkowego...</p>

        <a href="film.html" class="surprise-btn">
            <span class="btn-icon">🎁</span>
            <span class="btn-text">NIESPODZIANKA</span>
            <span class="btn-sparkles">💖</span>
        </a>
    </main>

    <script>
        // Efekt opadających serduszek i kwiatków (Sakura)
        const particlesContainer = document.getElementById('particles');
        const symbols = ['🌸', '💖', '✨', '🎀', '🐾', '⭐', '🌺'];

        function createParticle() {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            particle.innerText = symbols[Math.floor(Math.random() * symbols.length)];
            particle.style.left = Math.random() * 100 + 'vw';
            particle.style.animationDuration = (Math.random() * 3 + 3) + 's';
            particle.style.fontSize = (Math.random() * 15 + 15) + 'px';
            
            particlesContainer.appendChild(particle);

            setTimeout(() => {
                particle.remove();
            }, 6000);
        }

        setInterval(createParticle, 300);
    </script>
</body>
</html>
